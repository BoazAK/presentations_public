# Mode hardened : TLS uniquement, identité par client, ACL par topic.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile /mosquitto/tls/ca.crt
certfile /mosquitto/tls/server.crt
keyfile /mosquitto/tls/server.key
tls_version tlsv1.2

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
connection_messages true
